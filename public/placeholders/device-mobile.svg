<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3a"/>
      <stop offset="100%" style="stop-color:#1a1a2a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#1a1a28"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Phone frame -->
  <rect x="20" y="20" width="335" height="772" rx="40" fill="url(#frame)"/>
  <rect x="30" y="30" width="315" height="752" rx="32" fill="url(#screen)"/>

  <!-- Notch -->
  <rect x="120" y="40" width="135" height="28" rx="14" fill="#0a0a0f"/>

  <!-- Screen content -->
  <rect x="45" y="90" width="285" height="650" rx="8" fill="rgba(0,212,255,0.03)"/>

  <!-- UI mockup elements -->
  <rect x="60" y="120" width="180" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
  <rect x="60" y="145" width="120" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="180" width="255" height="150" rx="8" fill="rgba(255,255,255,0.03)"/>
  <rect x="60" y="350" width="255" height="100" rx="8" fill="rgba(255,255,255,0.02)"/>

  <!-- Home indicator -->
  <rect x="137" y="755" width="100" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>

  <!-- Label -->
  <text x="187.5" y="520" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Mobile</text>
  <text x="187.5" y="545" text-anchor="middle" fill="rgba(0,212,255,0.3)" font-family="system-ui, sans-serif" font-size="12">PLACEHOLDER</text>
</svg>
