  <text x="200" y="160" text-anchor="middle" fill="#f4d03f" font-family="Georgia, serif" font-size="16" font-weight="bold">Certificate of Achievement</text>
  <rect x="80" y="180" width="240" height="2" fill="url(#goldAccent)" opacity="0.3"/>
  <text x="200" y="210" text-anchor="middle" fill="#8899aa" font-family="Arial, sans-serif" font-size="10">Professional Certification</text>
  <circle cx="80" cy="240" r="15" fill="none" stroke="url(#goldAccent)" stroke-width="1" opacity="0.5"/>
