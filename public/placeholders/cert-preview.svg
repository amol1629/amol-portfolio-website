<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#certBg)" rx="8"/>
  <rect x="20" y="20" width="360" height="240" fill="none" stroke="url(#goldAccent)" stroke-width="2" rx="4"/>
  <rect x="30" y="30" width="340" height="220" fill="none" stroke="url(#goldAccent)" stroke-width="0.5" rx="2" opacity="0.5"/>
