<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="160" y="140" width="1600" height="800" rx="24" fill="url(#accent)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <text x="960" y="520" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="48" font-weight="600">Project Hero Image</text>
  <text x="960" y="580" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="24">1920 × 1080</text>
  <text x="960" y="640" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="system-ui, sans-serif" font-size="18" font-weight="500">PLACEHOLDER</text>
</svg>
