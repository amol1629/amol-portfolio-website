<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#1a1a28"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3a"/>
      <stop offset="100%" style="stop-color:#1a1a2a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Laptop body -->
  <rect x="120" y="60" width="1200" height="720" rx="20" fill="url(#bezel)"/>
  <rect x="140" y="80" width="1160" height="660" rx="8" fill="url(#screen)"/>

  <!-- Screen content placeholder -->
  <rect x="180" y="120" width="1080" height="580" rx="8" fill="rgba(0,212,255,0.05)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- UI mockup lines -->
  <rect x="220" y="160" width="300" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
  <rect x="220" y="190" width="200" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="220" y="240" width="1000" height="400" rx="8" fill="rgba(255,255,255,0.03)"/>

  <!-- Base -->
  <ellipse cx="720" cy="810" rx="600" ry="30" fill="url(#bezel)"/>
  <rect x="200" y="780" width="1040" height="40" rx="4" fill="url(#bezel)"/>

  <!-- Label -->
  <text x="720" y="450" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="28" font-weight="500">Laptop Mockup</text>
  <text x="720" y="490" text-anchor="middle" fill="rgba(0,212,255,0.4)" font-family="system-ui, sans-serif" font-size="16">PLACEHOLDER</text>
</svg>
